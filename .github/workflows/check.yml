# The quality gate on GitHub's side: the same npm run check save.ts runs, on every PR and again in the merge queue.
# The ruleset requires this job; the reviewer in gate.yml judges any change to this file.
name: check
on:
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The official Vale binary, pinned by checksum, so npm run check lints rules here as it does locally.
      - name: Install Vale
        run: |
          curl -fsSLo vale.tgz https://github.com/vale-cli/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz
          echo "22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed  vale.tgz" | sha256sum -c -
          sudo tar -xzf vale.tgz -C /usr/local/bin vale
      - run: npm run check
        env:
          GH_TOKEN: ${{ github.token }}
